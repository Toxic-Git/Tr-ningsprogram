<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SBD Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111318;
  --surface: #1a1d24;
  --surface2: #22262f;
  --border: #2e3240;
  --text: #f0ece4;
  --muted: #6b7280;
  --gold: #d4a843;
  --gold-dim: #9a7830;
  --sq: #4a90d9;
  --bp: #d4a843;
  --dl: #e05c4a;
  --green: #3db87a;
  --red: #e05c4a;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; overflow-x:hidden; }

/* ── VIEWS ── */
.view { display:none; min-height:100vh; padding-bottom:80px; }
.view.active { display:block; }

/* ── TOP BAR ── */
.topbar {
  position:sticky; top:0; z-index:100;
  background:rgba(17,19,24,0.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 18px 12px;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar-title {
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px; font-weight:900; letter-spacing:1px; text-transform:uppercase;
}
.topbar-sub { font-size:11px; color:var(--muted); margin-top:1px; }
.topbar-badge {
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  padding:4px 10px; border-radius:4px; background:var(--surface2); color:var(--gold);
}

/* ── NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:rgba(26,29,36,0.97); backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;
}
.nav-btn {
  flex:1; padding:12px 4px 10px; border:none; background:none;
  color:var(--muted); cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; transition:color .15s;
}
.nav-btn.active { color:var(--gold); }
.nav-icon { font-size:20px; line-height:1; }
.nav-label { font-size:10px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }

/* ── TODAY VIEW ── */
.today-header {
  padding:20px 18px 12px;
  display:flex; justify-content:space-between; align-items:flex-end;
}
.today-day-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:600; letter-spacing:3px;
  text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}
.today-day-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:34px; font-weight:900; text-transform:uppercase; line-height:1;
}
.week-pill {
  font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  padding:5px 12px; border-radius:20px; border:1px solid var(--border); color:var(--muted);
}
.week-pill.b1 { border-color:var(--bp); color:var(--bp); }
.week-pill.b2 { border-color:var(--dl); color:var(--dl); }
.week-pill.b3 { border-color:var(--sq); color:var(--sq); }

/* rest day */
.rest-card {
  margin:18px; background:var(--surface); border-radius:var(--radius);
  padding:40px 24px; text-align:center;
}
.rest-icon { font-size:48px; margin-bottom:12px; }
.rest-title { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:900; text-transform:uppercase; }
.rest-sub { font-size:14px; color:var(--muted); margin-top:6px; font-weight:300; }

/* exercise card */
.ex-card {
  margin:0 18px 12px; background:var(--surface);
  border-radius:var(--radius); overflow:hidden;
}
.ex-header {
  padding:14px 16px 10px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--border);
}
.ex-name {
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
}
.ex-target {
  font-size:12px; color:var(--muted); margin-top:2px; font-weight:300;
}
.ex-badge {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; padding:3px 8px;
  border-radius:4px;
}
.badge-sq { background:rgba(74,144,217,0.15); color:var(--sq); }
.badge-bp { background:rgba(212,168,67,0.15); color:var(--bp); }
.badge-dl { background:rgba(224,92,74,0.15); color:var(--dl); }
.badge-acc { background:var(--surface2); color:var(--muted); }
.badge-bd-sq { background:rgba(74,144,217,0.08); color:var(--sq); border:1px solid rgba(74,144,217,0.3); }
.badge-bd-bp { background:rgba(212,168,67,0.08); color:var(--bp); border:1px solid rgba(212,168,67,0.3); }
.badge-bd-dl { background:rgba(224,92,74,0.08); color:var(--dl); border:1px solid rgba(224,92,74,0.3); }
.badge-power { background:rgba(74,144,217,0.15); color:#7ec8ff; border:1px solid rgba(74,144,217,0.4); }

/* set rows */
.set-row {
  display:grid; grid-template-columns:36px 1fr 1fr 44px;
  gap:8px; padding:10px 16px; align-items:center;
  border-bottom:1px solid var(--border);
  transition:background .15s;
}
.set-row:last-child { border-bottom:none; }
.set-row.completed { background:rgba(61,184,122,0.06); }
.set-num {
  font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700;
  color:var(--muted); text-align:center;
}
.set-row.completed .set-num { color:var(--green); }

.set-input {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:'Barlow',sans-serif; font-size:15px;
  font-weight:500; padding:8px 10px; text-align:center; width:100%;
  -webkit-appearance:none; appearance:none;
}
.set-input:focus { outline:none; border-color:var(--gold); }
.set-input.completed-input { border-color:var(--green); color:var(--green); }

.set-label { font-size:10px; color:var(--muted); text-align:center; margin-top:2px; letter-spacing:1px; }

.check-btn {
  width:36px; height:36px; border-radius:50%; border:2px solid var(--border);
  background:none; color:var(--muted); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s;
  flex-shrink:0;
}
.check-btn.done { background:var(--green); border-color:var(--green); color:white; }

/* RPE pill */
.rpe-pill {
  display:inline-flex; align-items:center; gap:4px;
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase;
  padding:2px 8px; border-radius:4px; border:1px solid;
}
.rpe-easy   { background:rgba(61,184,122,0.12); color:#3db87a; border-color:rgba(61,184,122,0.3); }
.rpe-mod    { background:rgba(212,168,67,0.12);  color:var(--gold); border-color:rgba(212,168,67,0.3); }
.rpe-hard   { background:rgba(224,92,74,0.12);   color:var(--dl);   border-color:rgba(224,92,74,0.3); }
.rpe-max    { background:rgba(180,40,40,0.15);   color:#e84040;     border-color:rgba(180,40,40,0.4); }

/* Equipment badges */
.equip-badge {
  display:inline-flex; align-items:center; gap:2px;
  font-size:9px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
  padding:1px 5px; border-radius:3px; margin-left:5px; vertical-align:middle;
  font-family:'Barlow Condensed',sans-serif;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
  color:var(--muted);
}

/* PR badges */
.pr-badge {
  display:inline-flex; align-items:center; gap:3px;
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:900;
  letter-spacing:1px; text-transform:uppercase;
  padding:2px 6px; border-radius:4px; margin-left:4px;
  animation: prPop .4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.pr-1rm   { background:linear-gradient(135deg,#f5a623,#f76b1c); color:white; }
.pr-rep   { background:linear-gradient(135deg,#56ccf2,#2f80ed); color:white; }
.pr-vol   { background:linear-gradient(135deg,#6fcf97,#219653); color:white; }
.pr-set   { background:linear-gradient(135deg,#bb6bd9,#9b51e0); color:white; }
@keyframes prPop {
  0%   { transform:scale(0); opacity:0; }
  70%  { transform:scale(1.15); opacity:1; }
  100% { transform:scale(1); opacity:1; }
}

/* PR flash overlay on set row */
.set-row.pr-flash {
  animation: rowFlash .6s ease-out;
}
@keyframes rowFlash {
  0%   { background:rgba(245,166,35,0.25); }
  100% { background:rgba(61,184,122,0.06); }
}

/* RPE input on last set */
.rpe-input {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  color:var(--gold); font-family:'Barlow Condensed',sans-serif; font-size:14px;
  font-weight:700; padding:8px 6px; text-align:center; width:100%;
  -webkit-appearance:none; appearance:none;
}
.rpe-input:focus { outline:none; border-color:var(--gold); }
.rpe-input::placeholder { color:var(--muted); font-size:12px; font-weight:400; }
.set-row-5col {
  display:grid; grid-template-columns:36px 1fr 1fr 52px 44px;
  gap:6px; padding:10px 16px; align-items:center;
  border-bottom:1px solid var(--border); transition:background .15s;
}
.set-row-5col.completed { background:rgba(61,184,122,0.06); }
.set-row-5col.completed .set-num { color:var(--green); }

/* Autoreg suggestion */
.autoreg-bar {
  padding:10px 16px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:10px; font-size:12px;
}
.autoreg-icon { font-size:16px; flex-shrink:0; }
.autoreg-text { color:var(--muted); font-weight:300; line-height:1.5; flex:1; }
.autoreg-text strong { font-weight:600; }
.autoreg-up   strong { color:#3db87a; }
.autoreg-down strong { color:var(--dl); }
.autoreg-hold strong { color:var(--gold); }
.toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--steel); color:var(--text); border:1px solid var(--border);
  border-left:3px solid var(--gold);
  padding:10px 18px; border-radius:8px; font-size:13px; font-weight:400;
  white-space:nowrap; z-index:500; opacity:0;
  transition:opacity .25s, transform .25s;
  pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.pr-summary {
  margin:0 18px 10px;
  background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(247,107,28,0.05));
  border:1px solid rgba(245,166,35,0.25); border-radius:var(--radius);
  padding:14px 16px;
}
.pr-summary-title {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:10px;
}
.pr-summary-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:5px 0; border-bottom:1px solid rgba(245,166,35,0.1); font-size:13px;
}
.pr-summary-row:last-child { border-bottom:none; }

.set-header-row {
  display:grid; grid-template-columns:36px 1fr 1fr 44px;
  gap:8px; padding:6px 16px 4px;
}
.set-col-label { font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; text-align:center; }

/* finish button */
.finish-btn {
  margin:18px; padding:16px; border-radius:var(--radius); border:none;
  background:var(--green); color:white; width:calc(100% - 36px);
  font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer;
  transition:opacity .15s;
}
.finish-btn:active { opacity:0.8; }
.finish-btn:disabled { background:var(--surface2); color:var(--muted); }

/* ── PROGRAM VIEW ── */
.prog-week-row {
  display:flex; align-items:center; gap:12px;
  padding:14px 18px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background .15s;
}
.prog-week-row:active { background:var(--surface); }
.prog-week-num {
  font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:900;
  color:var(--muted); width:32px; flex-shrink:0; text-align:center;
}
.prog-week-num.current { color:var(--gold); }
.prog-week-info { flex:1; }
.prog-week-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; text-transform:uppercase; }
.prog-week-detail { font-size:12px; color:var(--muted); margin-top:2px; font-weight:300; }
.prog-week-status { font-size:18px; }
.prog-block-header {
  padding:10px 18px 6px;
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase;
}
.prog-block-header.b1 { color:var(--bp); }
.prog-block-header.b2 { color:var(--dl); }
.prog-block-header.b3 { color:var(--sq); }

/* ── HISTORY VIEW ── */
.hist-empty {
  padding:60px 24px; text-align:center; color:var(--muted);
}
.hist-entry {
  margin:0 18px 10px; background:var(--surface);
  border-radius:var(--radius); padding:16px;
}
.hist-entry-header {
  display:flex; justify-content:space-between; margin-bottom:10px;
}
.hist-entry-day { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; text-transform:uppercase; }
.hist-entry-date { font-size:12px; color:var(--muted); font-weight:300; }
.hist-lift-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:13px; }
.hist-lift-row:last-child { border-bottom:none; }
.hist-lift-name { color:var(--muted); font-weight:300; }
.hist-lift-val { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; }

/* ── SETTINGS VIEW ── */
.settings-section { padding:20px 18px 8px; }
.settings-label {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:12px;
}
.settings-card { background:var(--surface); border-radius:var(--radius); overflow:hidden; margin-bottom:12px; }
.settings-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-bottom:1px solid var(--border);
}
.settings-row:last-child { border-bottom:none; }
.settings-row-label { font-size:14px; font-weight:400; }
.settings-row-val { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--gold); }
.week-selector { display:flex; align-items:center; gap:12px; }
.week-btn {
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.week-btn:active { background:var(--border); }
.danger-btn {
  margin:0 18px; padding:14px; border-radius:var(--radius); border:1px solid var(--dl);
  background:none; color:var(--dl); width:calc(100% - 36px);
  font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer;
}

/* ── MODAL ── */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  align-items:flex-end; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--surface); border-radius:var(--radius) var(--radius) 0 0;
  width:100%; max-width:480px; padding:24px 20px 40px;
  animation:slideUp .25s ease;
}
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.modal-title {
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:900;
  text-transform:uppercase; margin-bottom:16px;
}
.modal-body { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:20px; }
.modal-actions { display:flex; gap:10px; }
.modal-btn {
  flex:1; padding:13px; border-radius:8px; border:none;
  font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; cursor:pointer;
}
.modal-cancel { background:var(--surface2); color:var(--muted); }
.modal-confirm { background:var(--green); color:white; }

/* progress bar top */
.progress-bar-wrap { padding:0 18px 14px; }
.progress-track { height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--gold); border-radius:2px; transition:width .4s ease; }
.progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:5px; }

/* ── REST TIMER OVERLAY ── */
.timer-overlay {
  display:none; position:fixed; inset:0; z-index:400;
  background:rgba(10,11,14,0.96); backdrop-filter:blur(8px);
  flex-direction:column; align-items:center; justify-content:center;
  gap:0;
}
.timer-overlay.open { display:flex; }
.timer-label {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:20px;
}
.timer-ring-wrap { position:relative; width:220px; height:220px; margin-bottom:24px; }
.timer-ring-wrap svg { transform:rotate(-90deg); }
.timer-ring-bg { fill:none; stroke:var(--surface2); stroke-width:8; }
.timer-ring-fill { fill:none; stroke:var(--gold); stroke-width:8; stroke-linecap:round;
  transition:stroke-dashoffset .95s linear; }
.timer-ring-fill.urgent { stroke:var(--dl); }
.timer-count {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.timer-mm-ss {
  font-family:'Barlow Condensed',sans-serif; font-size:64px; font-weight:900;
  line-height:1; letter-spacing:-2px;
}
.timer-lift-name {
  font-size:13px; color:var(--muted); font-weight:300; margin-top:4px; text-align:center;
}
.timer-actions { display:flex; gap:12px; }
.timer-btn {
  padding:13px 28px; border-radius:10px; border:none; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
}
.timer-skip { background:var(--surface2); color:var(--muted); }
.timer-add { background:var(--surface); color:var(--gold); border:1px solid var(--gold-dim); }
.timer-done-flash {
  position:absolute; inset:0; background:rgba(61,184,122,0.15);
  border-radius:50%; animation:flashPulse .6s ease-out forwards;
  pointer-events:none;
}
@keyframes flashPulse { 0%{opacity:1;transform:scale(0.8)} 100%{opacity:0;transform:scale(1.3)} }

/* ── PROGRESS CHART ── */
.chart-wrap { margin:0 18px 12px; background:var(--surface); border-radius:var(--radius); padding:16px; }
.chart-title {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:12px;
}
.chart-tabs { display:flex; gap:0; margin-bottom:14px; border-radius:6px; overflow:hidden; background:var(--surface2); }
.chart-tab {
  flex:1; padding:7px 4px; border:none; background:none; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; color:var(--muted); transition:all .15s;
}
.chart-tab.active-sq { background:rgba(74,144,217,0.2); color:var(--sq); }
.chart-tab.active-bp { background:rgba(212,168,67,0.2); color:var(--bp); }
.chart-tab.active-dl { background:rgba(224,92,74,0.2); color:var(--dl); }
.chart-canvas-wrap { position:relative; height:140px; }
.chart-empty { text-align:center; color:var(--muted); font-size:13px; padding:40px 0; font-weight:300; }

/* auto-prog suggestion */
.suggestion-bar {
  margin:0 18px 10px; background:rgba(212,168,67,0.08);
  border:1px solid rgba(212,168,67,0.2); border-radius:var(--radius);
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.suggestion-icon { font-size:20px; flex-shrink:0; }
.suggestion-text { font-size:13px; color:var(--text); font-weight:300; line-height:1.5; flex:1; }
.suggestion-text strong { color:var(--gold); font-weight:600; }
</style>
</head>
<body>

<!-- TODAY -->
<div class="view active" id="view-today">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="topbar-title">SBD Tracker</div>
      <div class="topbar-sub" id="today-date"></div>
    </div>
    <div class="topbar-badge" id="today-block-badge"></div>
  </div>
  <div id="
